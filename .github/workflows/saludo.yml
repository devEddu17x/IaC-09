name: Saludo
on:
  push:
    branches:
      - main
      - develop
env:
  MI_NOMBRE: EDDU
jobs:
  saludo:
    runs-on: ubuntu-latest
    steps:
      - name: Saludo desde main
        run: echo "¡Hola, desde main soy ${{ env.MI_NOMBRE }}"
        if: github.ref == 'refs/heads/main'
        
      - name: Saludo desde develop
        run: echo "¡Hola, desde develop soy ${{ env.MI_NOMBRE }}"
        if: github.ref == 'refs/heads/develop'